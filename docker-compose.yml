services:
  yape-redis:
    image: "redis:alpine"
    container_name: yape-redis
    ports:
      - "6379:6379"
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - yape-redis_data:/data
    networks:
      - yape-challenge-network
      
  yape-postgres:
    image: "postgres:14-alpine"
    container_name: yape-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - yape-challenge-data:/var/lib/postgresql/data
      - './transaction/src/bootstrap/init.sql:/docker-entrypoint-initdb.d/init.sql'
    networks:
      - yape-challenge-network

  zookeeper:
    image: confluentinc/cp-zookeeper:5.5.3
    container_name: yape-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - yape-challenge-network

  yape-kafka:
    image: confluentinc/cp-enterprise-kafka:5.5.3
    container_name: yape-kafka
    hostname: yape-kafka
    depends_on: [zookeeper]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://yape-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9991
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - yape-kafka_data:/var/lib/kafka/data
    networks:
      - yape-challenge-network

  yape-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: yape-kafka-ui
    restart: unless-stopped
    depends_on: [yape-kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: yape-kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - yape-challenge-network

  yape-transaction:
    build:
      context: ./transaction
      dockerfile: Dockerfile
      target: production
    container_name: yape-transaction
    depends_on: [yape-postgres, yape-redis, yape-kafka]
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - yape-challenge-network

  yape-anti-fraud:
    build:
      context: ./anti-fraud
      dockerfile: Dockerfile
      target: production
    container_name: yape-anti-fraud
    depends_on: [yape-kafka]
#    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3001"
    networks:
      - yape-challenge-network

networks:
  yape-challenge-network:
    name: yape-challenge-network

volumes:
  yape-challenge-data:
  yape-redis_data:
  yape-kafka_data:

